services:
  - type: web
    name: ca-flow-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ca-flow-db
          property: connectionString

databases:
  - name: ca-flow-db
    plan: free
    databaseName: caflow
